{{- if .Values.localai.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai-deployment
  labels:
    app: localai
spec:
  replicas: {{ .Values.localai.replicaCount }}
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      containers:
      - name: localai
        image: "{{ .Values.localai.image.repository }}:{{ .Values.localai.image.tag }}"
        imagePullPolicy: {{ .Values.localai.image.pullPolicy }}
        ports:
        - containerPort: 8080
        resources:
{{ toYaml .Values.localai.resources | indent 10 }}
        livenessProbe:
{{ toYaml .Values.localai.livenessProbe | indent 10 }}
        readinessProbe:
{{ toYaml .Values.localai.readinessProbe | indent 10 }}
{{- end }}
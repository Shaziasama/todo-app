apiVersion: v2
name: phase4-chatbot
description: A Helm chart for deploying the Phase 3 Chatbot application and LocalAI

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into a Kubernetes application.
# Library charts provide reusable utilities or functions for the templating logic, but don't themselves deploy anything.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
version: 0.1.0

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application.
appVersion: "1.0.0"
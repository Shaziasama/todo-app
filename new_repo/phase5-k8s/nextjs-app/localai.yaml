apiVersion: v1
kind: Pod
metadata:
  name: {{ include "nextjs-app.fullname" . }}-localai
  labels:
    {{- include "nextjs-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: localai
spec:
  containers:
    - name: localai
      image: "{{ .Values.localai.image.repository }}:{{ .Values.localai.image.tag }}"
      imagePullPolicy: {{ .Values.localai.image.pullPolicy }}
      ports:
        - name: http
          containerPort: {{ .Values.localai.service.port }}
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextjs-app.fullname" . }}-localai
  labels:
    {{- include "nextjs-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: localai
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.localai.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "nextjs-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: localai
